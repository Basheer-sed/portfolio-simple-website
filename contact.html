<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Young+Serif&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>
  </head>
  <body>
    <div class="container">
      <div class="section-one">
        <h1 class="section-one__name">Basheer Ahmed</h1>
        <p class="section-one__role">Web Developer</p>
        <button class="section-one__button">
          <a href="index.html">Home</a>
        </button>
      </div>
      <div class="contact-form">
        <form>
          <table>
            <tr>
              <td>Name:</td>
              <td>
                <input
                  type="text"
                  placeholder="Enter your Name"
                  class="contact-form__input"
                />
              </td>
            </tr>
            <tr>
              <td>Email:</td>
              <td>
                <input
                  type="text"
                  placeholder="Enter your Email"
                  class="contact-form__input"
                />
              </td>
            </tr>
            <tr>
              <td>Message:</td>
              <td>
                <textarea
                  placeholder="Message"
                  class="contact-form__textarea"
                ></textarea>
              </td>
            </tr>
            <tr>
              <td></td>
              <td><button class="contact-form__button">Submit</button></td>
            </tr>
          </table>
        </form>
      </div>
      <div class="section-five">
        <p>Web App: <a href="https://dev.gopark.app/">GoPark Admin Site</a></p>
        <p>&copy; Basheer Ahmed</p>
      </div>
    </div>
  </body>
</html>
